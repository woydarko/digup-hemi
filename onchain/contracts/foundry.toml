[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=node_modules/forge-std/src/",
]

[rpc_endpoints]
hemi = "https://rpc.hemi.network/rpc"
hemi_testnet = "https://testnet.rpc.hemi.network/rpc"
