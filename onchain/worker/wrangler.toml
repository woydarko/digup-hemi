name = "digup-hemi"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Unity WebGL build output (File > Build Settings > Build, folder Build/WebGL at the Unity project root)
[assets]
directory = "../../Build/WebGL"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
NETWORK = "mainnet" # "testnet" | "mainnet"
CONTRACT = "0x4999e6986165A727a358453797E824beec597575" # DigUp, same address on Hemi mainnet and testnet
MAX_PLAUSIBLE_SCORE = "50000" # relayer rejects runs above this; tune after measuring real runs

# Secret (never commit): npx wrangler secret put RELAYER_KEY
